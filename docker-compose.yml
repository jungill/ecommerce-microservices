services:

  # ── postgres ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=ecommerce
      - POSTGRES_USER=ecommerce
      - POSTGRES_PASSWORD=ecommerce
    volumes:
      - ecommerce-db:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 5s
      retries: 10

  # ── product-service ──────────────────────────────────────────────────────────
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - JDBC_URL=jdbc:postgresql://postgres:5432/ecommerce?user=ecommerce&password=ecommerce
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── order-service ─────────────────────────────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      # Dans Docker, on utilise le nom du service (pas localhost)
      - JDBC_URL=jdbc:postgresql://postgres:5432/ecommerce?user=ecommerce&password=ecommerce
      - PRODUCT_SERVICE_URL=http://product-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - ecommerce-network

  # ── gateway-service ───────────────────────────────────────────────────────────
  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8081
      - ORDER_SERVICE_URL=http://order-service:8082
    depends_on:
      - product-service
      - order-service
    networks:
      - ecommerce-network

  # ── frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4200:80"   # Nginx écoute sur 80, on expose sur 4200
    depends_on:
      - gateway-service
    networks:
      - ecommerce-network

# ── Réseau et volume ──────────────────────────────────────────────────────────
networks:
  ecommerce-network:
    driver: bridge

volumes:
  ecommerce-db: